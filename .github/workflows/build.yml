name: CI

on:
  push:
    branches: [ master, main ]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # NOTE: runner must contain the Xcode version from versions.json.
    # versions.json currently requires Xcode 26.2 -> use a recent macOS runner.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v2
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer

      - name: Inject API credentials (from secrets)
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          python3 - <<'PY'
          import json, os
          p = "build-system/ghostgram-configuration.json"
          required = ("API_ID", "API_HASH")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing required GitHub Actions secrets: " + ", ".join(missing))
          api_id = os.environ["API_ID"].strip()
          if not api_id.isdecimal():
              raise SystemExit("API_ID must be the numeric ID from my.telegram.org; its value is not logged")
          api_hash = os.environ["API_HASH"].strip()
          if len(api_hash) != 32 or any(char not in "0123456789abcdefABCDEF" for char in api_hash):
              raise SystemExit("API_HASH must be the 32-character hexadecimal hash from my.telegram.org; its value is not logged")
          with open(p, encoding="utf-8") as f:
              d = json.load(f)
          changed = []
          for key, env in (("api_id", "API_ID"), ("api_hash", "API_HASH")):
              val = api_id if env == "API_ID" else api_hash
              if val:
                  d[key] = val
                  changed.append(key)
          with open(p, "w", encoding="utf-8") as f:
              json.dump(d, f, indent="\t", ensure_ascii=False)
          print("Injected from secrets:", changed)
          print("bundle_id =", d.get("bundle_id"), "| api_id set =", bool(d.get("api_id")))
          PY

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Build the App
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          # rules_apple normally requires an embedded profile for device bundles;
          # this build is unsigned and will be re-signed by Sideloadly.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build-system/bazel-rules/rules_apple/apple/internal/partials/provisioning_profile.bzl")
          source = path.read_text(encoding="utf-8")
          original = "\n".join([
              "    if not profile_artifact:",
              "        fail(",
              '            "\\n".join([',
              '                "ERROR: In {}:".format(str(rule_label)),',
              '                "Building for device, but no provisioning_profile attribute was set.",',
              "            ]),",
              "        )",
          ])
          replacement = "\n".join([
              "    if not profile_artifact:",
              "        return struct(bundle_files = [])",
          ])
          if source.count(original) != 1:
              raise SystemExit("rules_apple provisioning-profile block did not match the expected version")
          path.write_text(source.replace(original, replacement, 1), encoding="utf-8")
          PY

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/ghostgram-configuration.json" \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --disableProvisioningProfiles \
            --disablePushEntitlements \
            --outputBuildArtifactsPath="build/artifacts"

          test -s build/artifacts/Telegram.ipa
          test -s build/artifacts/Telegram.DSYMs.zip

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          release_name: Build ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            Unsigned iOS build ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }}).
            Install via AltStore / Sideloadly (see INSTALL.md).
          draft: false
          prerelease: false

      - name: Upload Release IPA
        id: upload-release-ipa
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          asset_name: Telegram.ipa
          asset_content_type: application/zip

      - name: Upload Release DSYM
        id: upload-release-dsym
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
          asset_name: Telegram.DSYMs.zip
          asset_content_type: application/zip
